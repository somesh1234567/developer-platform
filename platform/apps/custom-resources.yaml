apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-resources-examples
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: Somesh_Panigrahi
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/somesh1234567/developer-platform
      path: platform/examples
      directory:
        recurse: true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - allowEmpty=true