apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secrets-root
    app.kubernetes.io/managed-by: Somesh_Panigrahi
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/somesh1234567/developer-platform
      path: platform/manifests/external-secrets/overlays/local
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - allowEmpty=true
      - ServerSideApply=true