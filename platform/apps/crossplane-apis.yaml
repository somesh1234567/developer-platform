apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-apis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/somesh1234567/developer-platform
        revision: main
        directories:
          - path: platform/apis/*/*
  template:
    metadata:
      name: '{{index .path.segments 2}}-{{index .path.segments 3}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/somesh1234567/developer-platform
        targetRevision: main
        path: '{{.path.path}}'
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jsonPointers:
            - /status
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true