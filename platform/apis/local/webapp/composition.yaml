apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webapp-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: platform.example.io/v1alpha1
    kind: WebApp
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $xr.metadata.name }}
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: deployment
            spec:
              replicas: {{ $xr.spec.replicas }}
              selector:
                matchLabels:
                  app: {{ $xr.metadata.name }}
              template:
                metadata:
                  labels:
                    app: {{ $xr.metadata.name }}
                spec:
                  containers:
                    - name: app
                      image: {{ $xr.spec.image }}
                      ports:
                        - containerPort: {{ $xr.spec.port }}
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: {{ $xr.metadata.name }}
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: service
            spec:
              selector:
                app: {{ $xr.metadata.name }}
              ports:
                - port: {{ $xr.spec.port }}
                  targetPort: {{ $xr.spec.port }}
    - step: ready
      functionRef:
        name: function-auto-ready